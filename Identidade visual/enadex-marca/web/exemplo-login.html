<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — EnadeX</title>
<link rel="icon" href="favicons/favicon.ico" sizes="any">
<link rel="icon" href="favicons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicons/apple-touch-icon.png">
<meta name="theme-color" content="#0C3350">
<link rel="stylesheet" href="enadex.css">
<script src="theme.js"></script>
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: var(--space-6); }
  .login { width: 100%; max-width: 380px; }
  /* logo vertical com assinatura: 220px, 48px (space-12) até o formulário */
  .login .brand { display: flex; justify-content: center; margin-bottom: var(--space-12); }
  .login .brand img { width: 220px; height: auto; display: block; }
  .field { margin-bottom: var(--space-4); }
  .actions { display: grid; gap: var(--space-3); margin-top: var(--space-6); }
  .actions .enx-btn { width: 100%; }
  .foot { margin-top: var(--space-8); text-align: center; }
</style>
</head>
<body>
<main class="login">
  <div class="brand">
    <img class="enx-logo-light" src="img/enadex-vertical.svg" alt="EnadeX — ENADE eXplainability Framework" width="220" height="173">
    <img class="enx-logo-dark" src="img/enadex-vertical-negativo.svg" alt="" width="220" height="173">
  </div>
  <form class="enx-card" onsubmit="return false">
    <h1 class="enx-h2" style="margin-bottom:var(--space-6)">Entrar</h1>
    <div class="field"><label class="enx-label" for="email">E-mail institucional</label><input class="enx-input" id="email" type="email" autocomplete="email"></div>
    <div class="field"><label class="enx-label" for="senha">Senha</label><input class="enx-input" id="senha" type="password" autocomplete="current-password"></div>
    <div class="actions">
      <button class="enx-btn enx-btn-primary" type="submit">Entrar</button>
      <a class="enx-small" href="#" style="text-align:center">Esqueci minha senha</a>
    </div>
  </form>
  <p class="foot enx-caption">Dados abertos do INEP, microdados do ENADE.</p>
</main>
</body>
</html>
